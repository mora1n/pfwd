name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            service/go.sum
            xdp/go.sum

      - name: Install eBPF build tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Build release assets
        run: |
          ./xdp/build.sh
          ./service/build.sh

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pfwd-xdp-linux-amd64
            dist/pfwd-xdp-linux-arm64
            dist/pfwd-service-linux-amd64
            dist/pfwd-service-linux-arm64
